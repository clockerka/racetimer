name: racetimer
options:
  bundleIdPrefix: com.racetimer
  deploymentTarget:
    iOS: 16.0
packages:
  SVGView:
    url: https://github.com/exyte/SVGView.git
    from: 1.0.6
targets:
  racetimer:
    type: application
    platform: iOS
    deploymentTarget: 16.0
    sources:
      - path: .
        excludes:
          - "*.md"
          - "*.json"
          - "*.yml"
          - "*.sh"
          - ".git"
          - "racetimer.xcodeproj"
          - "TNoodleLibNative.xcframework"
    dependencies:
      - package: SVGView
      - framework: TNoodleLibNative.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.racetimer.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: RaceTimer
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        SWIFT_VERSION: 5.9
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_OBJC_BRIDGING_HEADER: racetimer-Bridging-Header.h
        DEVELOPMENT_TEAM: 4UXF524SDA
